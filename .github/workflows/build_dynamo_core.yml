name: Build DynamoCore.sln

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_windows_runtime:
    name: Build DynamoCore windows runtime
    runs-on: windows-latest
    steps:
      - name: Checkout Dynamo Repo
        uses: actions/checkout@v5
        with:
          path: Dynamo
          repository: DynamoDS/Dynamo
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.100-preview.5.25277.114
      - name: Disable problem matcher
        run: Write-Output "::remove-matcher owner=csc::"
      - name: Install dependencies for windows runtime
        run: dotnet restore ${{ github.workspace }}\Dynamo\src\DynamoCore.sln --runtime=win-x64 -p:Configuration=Release -p:DotNet=net10.0
      - name: Build DynamoCore with dotnet CLI for Windows
        run: dotnet build ${{ github.workspace }}\Dynamo\src\DynamoCore.sln --configuration Release --runtime win-x64 --no-restore --verbosity normal
      - name: Look for DynamoCLI.exe
        run: |
          Write-Output "***Locating DynamoCLI.exe!***"
          if (Test-Path -Path "${{ github.workspace }}\Dynamo\bin\AnyCPU\Release\DynamoCLI.exe") {
            Write-Output "DynamoCLI.exe exists!"
          } else {
            Write-Error "DynamoCLI.exe was not found!"
          }
      - name: Run DynamoCore Unit Tests
        run: |
          cd "${{ github.workspace }}\Dynamo\bin\AnyCPU\Release"
          dotnet test DynamoCoreTests.dll --filter "TestCategory=UnitTest&TestCategory!=GeometryTests" --verbosity normal --logger trx --results-directory TestResults
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dynamocore-windows
          path: ${{ github.workspace }}\Dynamo\TestResults
          retention-days: 7
  build_linux_runtime_on_windows:
    name: Build DynamoCore linux runtime on windows
    runs-on: windows-latest
    steps:
      - name: Checkout Dynamo Repo
        uses: actions/checkout@v5
        with:
          path: Dynamo
          repository: DynamoDS/Dynamo
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.100-preview.5.25277.114
      - name: Disable problem matcher
        run: Write-Output "::remove-matcher owner=csc::"
      - name: Install dependencies for linux runtime
        run: dotnet restore ${{ github.workspace }}\Dynamo\src\DynamoCore.sln --runtime=linux-x64 -p:Configuration=Release -p:Platform=NET_Linux -p:DotNet=net10.0
      - name: Build DynamoCore with dotnet CLI for Linux
        run: dotnet build ${{ github.workspace }}\Dynamo\src\DynamoCore.sln --configuration Release --runtime linux-x64 --no-restore --verbosity normal
      - name: Look for DynamoCLI
        run: |
          Write-Output "***Locating DynamoCLI for Linux!***"
          if (Test-Path -Path "${{ github.workspace }}\Dynamo\bin\NET_Linux\Release\DynamoCLI") {
            Write-Output "DynamoCLI exists!"
          } else {
            Write-Error "DynamoCLI was not found!"
          }
      - name: Run DynamoCore Unit Tests
        run: |
          cd "${{ github.workspace }}\Dynamo\bin\NET_Linux\Release"
          dotnet test DynamoCoreTests.dll --filter "TestCategory=UnitTests&TestCategory!=GeometryTests" --verbosity normal --logger trx --results-directory TestResults
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dynamocore-linux
          path: ${{ github.workspace }}\Dynamo\TestResults
          retention-days: 7
  build_linux_runtime_on_linux:
    name: Build DynamoCore linux runtime on linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dynamo Repo
        uses: actions/checkout@v5
        with:
          path: Dynamo
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.100-preview.5.25277.114
      - name: Disable problem matcher
        run: echo "::remove-matcher owner=csc::"
      - name: Install dependencies for linux runtime
        run: dotnet restore ${{ github.workspace }}/Dynamo/src/DynamoCore.sln --runtime=linux-x64 -p:Configuration=Release -p:Platform=NET_Linux -p:DotNet=net10.0
      - name: Build DynamoCore with dotnet for Linux
        run: dotnet build ${{ github.workspace }}/Dynamo/src/DynamoCore.sln -c Release /p:Platform=NET_Linux
      - name: Look for DynamoCLI.exe
        run: |
          echo "***Locating DynamoCLI for Linux!***"
          cd "${{ github.workspace }}/Dynamo/bin/NET_Linux/Release"
          test "./DynamoCLI.exe" && echo "DynamoCLI exists!"
      - name: Run smoke tests
        run: |
          cd "${{ github.workspace }}/Dynamo/bin/NET_Linux/Release"
          dotnet test DynamoCoreTests.dll --filter "TestCategory=UnitTests&TestCategory!=GeometryTests"
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dynamocore-linux
          path: ${{ github.workspace }}/Dynamo/TestResults
          retention-days: 7
